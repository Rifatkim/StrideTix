<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, Helvetica, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- ================= SUBSYSTEM BOUNDARY ================= -->
  <rect x="230" y="30" width="540" height="800" fill="#fafafa" stroke="#1e293b" stroke-width="2" rx="4" />
  
  <!-- Boundary Header -->
  <text x="250" y="58" font-size="13" fill="#64748b" font-style="italic" font-weight="600">&laquo;subsystem&raquo;</text>
  <text x="250" y="80" font-size="20" fill="#0f172a" font-weight="bold">StrideTix Platform</text>

  <!-- ================= STICK FIGURE MACROS ================= -->
  <!-- 1. USER / RUNNER (Left) -->
  <g id="actor-user" transform="translate(90, 360)">
    <!-- Head -->
    <circle cx="0" cy="-45" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Body -->
    <line x1="0" y1="-27" x2="0" y2="25" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Arms -->
    <line x1="-32" y1="-8" x2="32" y2="-8" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Legs -->
    <line x1="0" y1="25" x2="-25" y2="75" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="0" y1="25" x2="25" y2="75" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Label -->
    <text x="0" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">User (Pelari)</text>
  </g>

  <!-- 2. ORGANIZER (Right Top) -->
  <g id="actor-organizer" transform="translate(910, 260)">
    <!-- Head -->
    <circle cx="0" cy="-45" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Body -->
    <line x1="0" y1="-27" x2="0" y2="25" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Arms -->
    <line x1="-32" y1="-8" x2="32" y2="-8" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Legs -->
    <line x1="0" y1="25" x2="-25" y2="75" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="0" y1="25" x2="25" y2="75" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Label -->
    <text x="0" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Organizer</text>
  </g>

  <!-- 3. ADMINISTRATOR (Right Bottom) -->
  <g id="actor-admin" transform="translate(910, 640)">
    <!-- Head -->
    <circle cx="0" cy="-45" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Body -->
    <line x1="0" y1="-27" x2="0" y2="25" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Arms -->
    <line x1="-32" y1="-8" x2="32" y2="-8" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Legs -->
    <line x1="0" y1="25" x2="-25" y2="75" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="0" y1="25" x2="25" y2="75" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Label -->
    <text x="0" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Administrator</text>
  </g>

  <!-- ================= ASSOCIATION LINES ================= -->
  <!-- User lines -->
  <g stroke="#334155" stroke-width="1.5">
    <line x1="125" y1="360" x2="330" y2="105"/> <!-- to UC1 -->
    <line x1="125" y1="365" x2="330" y2="165"/> <!-- to UC2 -->
    <line x1="125" y1="370" x2="330" y2="225"/> <!-- to UC3 -->
    <line x1="125" y1="375" x2="330" y2="285"/> <!-- to UC4 -->
    <line x1="125" y1="380" x2="330" y2="345"/> <!-- to UC5 -->
    <line x1="125" y1="385" x2="330" y2="405"/> <!-- to UC6 -->
    <line x1="125" y1="390" x2="330" y2="465"/> <!-- to UC7 -->
  </g>

  <!-- Organizer lines -->
  <g stroke="#334155" stroke-width="1.5">
    <line x1="875" y1="260" x2="670" y2="105"/> <!-- to UC1 -->
    <line x1="875" y1="265" x2="670" y2="525"/> <!-- to UC8 -->
    <line x1="875" y1="270" x2="670" y2="585"/> <!-- to UC9 -->
    <line x1="875" y1="275" x2="670" y2="645"/> <!-- to UC10 -->
  </g>

  <!-- Administrator lines -->
  <g stroke="#334155" stroke-width="1.5">
    <line x1="875" y1="630" x2="670" y2="105"/> <!-- to UC1 -->
    <line x1="875" y1="640" x2="670" y2="705"/> <!-- to UC11 -->
    <line x1="875" y1="650" x2="670" y2="765"/> <!-- to UC12 -->
  </g>

  <!-- ================= USE CASE OVALS ================= -->
  <!-- UC1: Registrasi & Login Akun -->
  <g id="uc-1" transform="translate(500, 105)">
    <ellipse cx="0" cy="0" rx="170" ry="24" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Registrasi &amp; Login Akun</text>
  </g>

  <!-- UC2: Sinkronisasi Data Kebugaran -->
  <g id="uc-2" transform="translate(500, 165)">
    <ellipse cx="0" cy="0" rx="170" ry="24" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Sinkronisasi Data Kebugaran</text>
  </g>

  <!-- UC3: Lihat Rekomendasi Jarak Lomba -->
  <g id="uc-3" transform="translate(500, 225)">
    <ellipse cx="0" cy="0" rx="170" ry="24" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Lihat Rekomendasi Jarak Lomba</text>
  </g>

  <!-- UC4: Konsultasi AI Running Assistant -->
  <g id="uc-4" transform="translate(500, 285)">
    <ellipse cx="0" cy="0" rx="170" ry="24" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Konsultasi AI Running Assistant</text>
  </g>

  <!-- UC5: Cari & Eksplorasi Event Lari -->
  <g id="uc-5" transform="translate(500, 345)">
    <ellipse cx="0" cy="0" rx="170" ry="24" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Cari &amp; Eksplorasi Event Lari</text>
  </g>

  <!-- UC6: Pemesanan Tiket & Safety Warning -->
  <g id="uc-6" transform="translate(500, 405)">
    <ellipse cx="0" cy="0" rx="170" ry="24" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Pemesanan Tiket &amp; Safety Warning</text>
  </g>

  <!-- UC7: Kelola E-Ticket & QR Code -->
  <g id="uc-7" transform="translate(500, 465)">
    <ellipse cx="0" cy="0" rx="170" ry="24" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Kelola E-Ticket &amp; QR Code</text>
  </g>

  <!-- UC8: Kelola Event & Kategori Tiket -->
  <g id="uc-8" transform="translate(500, 525)">
    <ellipse cx="0" cy="0" rx="170" ry="24" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Kelola Event &amp; Kategori Tiket</text>
  </g>

  <!-- UC9: Pantau Kuota & Data Peserta -->
  <g id="uc-9" transform="translate(500, 585)">
    <ellipse cx="0" cy="0" rx="170" ry="24" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Pantau Kuota &amp; Data Peserta</text>
  </g>

  <!-- UC10: Validasi QR Code Check-In -->
  <g id="uc-10" transform="translate(500, 645)">
    <ellipse cx="0" cy="0" rx="170" ry="24" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Validasi QR Code Check-In</text>
  </g>

  <!-- UC11: Manajemen Pengguna -->
  <g id="uc-11" transform="translate(500, 705)">
    <ellipse cx="0" cy="0" rx="170" ry="24" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Manajemen Pengguna</text>
  </g>

  <!-- UC12: Moderasi Event & Audit Transaksi -->
  <g id="uc-12" transform="translate(500, 765)">
    <ellipse cx="0" cy="0" rx="170" ry="24" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Moderasi Event &amp; Audit Transaksi</text>
  </g>

</svg>
